[package]
name = "waveq"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CLI waveform-query tool for VCD/FST/GHW dumps"
license = "MIT OR Apache-2.0"

[lib]
name = "waveq"
path = "src/lib.rs"

[[bin]]
name = "waveq"
path = "src/main.rs"

[dependencies]
wellen = "0.25.7"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1.1", features = ["preserve_order"] }
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde", "anyhow"] }

[profile.release]
lto = "thin"
